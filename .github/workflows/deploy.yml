name: Collecte et déploiement

on:
  schedule:
    - cron: "0 5 * * *" # tous les jours à 5h UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Si Blizzard refuse les serveurs GitHub, on déploie les données déjà versionnées.
      - name: Collecte Overwatch
        continue-on-error: true
        run: python collector/overwatch.py
      # Sauvegarde les combinaisons rafraîchies : un prochain échec retombera sur ces données.
      # (un push fait avec GITHUB_TOKEN ne relance pas ce workflow)
      - name: Enregistre les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "data: mise à jour Overwatch" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
